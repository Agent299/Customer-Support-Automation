[project]
name = "customer-support-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Agent299", email = "meghallium@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[anthropic]>=2.64.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
customer-support-automation = "customer_support_automation:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "nest-asyncio>=1.6.0",
    "pydantic-evals>=2.64.0",
]
